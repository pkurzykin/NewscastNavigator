name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend and operations checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Compile backend sources
        run: python -m compileall backend/app backend/migrations backend/scripts

      - name: Run backend suite
        working-directory: backend
        run: pytest -q

      - name: Validate canonical Compose paths
        run: |
          docker compose --env-file .env.example -f compose.yaml config
          docker compose -f compose.test.yaml config
          docker compose --env-file deploy/env/demo.env.example -f deploy/compose.demo.yaml config

      - name: Validate operation scripts
        run: |
          bash -n deploy/scripts/*.sh
          pytest -q backend/tests/test_operations_contract.py backend/tests/test_demo_dataset_validation.py

      - name: Run isolated PostgreSQL policy checks
        run: |
          docker compose \
            --project-name nn-product-reset-eval-ci-policy \
            -f compose.test.yaml \
            run --rm backend-tests \
            pytest -q tests/test_product_reset_eval.py tests/test_repository_policy.py

      - name: Stop isolated PostgreSQL policy checks
        if: always()
        run: |
          docker compose \
            --project-name nn-product-reset-eval-ci-policy \
            -f compose.test.yaml \
            down -v --remove-orphans

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build
