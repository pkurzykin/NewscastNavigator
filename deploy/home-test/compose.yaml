name: newscast_navigator_home_test

services:
  db:
    image: ${HOME_TEST_DB_IMAGE:?installed PostgreSQL image required}
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - home_test_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  backend:
    image: newscast-navigator-backend:home-test
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      APP_NAME: Newscast Navigator API
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?required}
      CORS_ORIGINS: ${CORS_ORIGINS:?required}
      ALLOW_NULL_CORS_ORIGIN: "true"
      SEED_DEMO_DATA: "false"
      SECRET_KEY: ${SECRET_KEY:?required}
      SESSION_COOKIE_SECURE: "true"
      CAPTIONPANELS_TOKEN_TTL_SECONDS: ${CAPTIONPANELS_TOKEN_TTL_SECONDS:-28800}
      SCENARIO_LEASE_TTL_SECONDS: ${SCENARIO_LEASE_TTL_SECONDS:-90}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  frontend:
    image: newscast-navigator-frontend:home-test
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  gateway:
    image: newscast-navigator-gateway:home-test
    build:
      context: ../nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    environment:
      HOME_TEST_SERVER_NAME: ${HOME_TEST_SERVER_NAME:?private server name required}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      # Fixed to the LAN address observed during migration. Recheck before 2B.
      - "192.168.2.200:${HOME_TEST_HTTPS_PORT:-18443}:443"
    volumes:
      - ./gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${HOME_TEST_TLS_DIR:?private TLS directory required}:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q --header='Host: ${HOME_TEST_SERVER_NAME}' -O /dev/null https://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  home_test_pg_data:
