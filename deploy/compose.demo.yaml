name: newscast_navigator_demo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - demo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    image: newscast-navigator-backend:demo
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      APP_NAME: Newscast Navigator API
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ALLOW_NULL_CORS_ORIGIN: ${ALLOW_NULL_CORS_ORIGIN:-true}
      SEED_DEMO_DATA: "false"
      SECRET_KEY: ${SECRET_KEY}
      SESSION_COOKIE_SECURE: "true"
      CAPTIONPANELS_TOKEN_TTL_SECONDS: ${CAPTIONPANELS_TOKEN_TTL_SECONDS:-28800}
      SCENARIO_LEASE_TTL_SECONDS: ${SCENARIO_LEASE_TTL_SECONDS:-90}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  frontend:
    image: newscast-navigator-frontend:demo
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${FRONTEND_VITE_API_BASE_URL:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  gateway:
    image: newscast-navigator-gateway:demo
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${DEMO_BIND_HOST:-127.0.0.1}:${DEMO_HTTP_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  demo_pg_data:
