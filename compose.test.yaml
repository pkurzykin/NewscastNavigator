name: newscast_product_reset_test

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newscast_product_reset_test
      POSTGRES_USER: product_reset_test
      POSTGRES_PASSWORD: product_reset_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_reset_test -d newscast_product_reset_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

  backend-tests:
    image: python:3.11-bookworm
    working_dir: /workspace/backend
    environment:
      DATABASE_URL: postgresql+psycopg://product_reset_test:product_reset_test@db:5432/newscast_product_reset_test
      ENVIRONMENT: test
      SEED_DEMO_DATA: "false"
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      SECRET_KEY: product-reset-test-only
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: -p no:cacheprovider
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_ROOT_USER_ACTION: ignore
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/workspace:ro
      - product_reset_pip_cache:/root/.cache/pip
    entrypoint:
      - /bin/sh
      - -c
      - |
        command -v git >/dev/null
        python -m pip install --quiet --require-hashes -r requirements-dev.lock
        exec "$@"
      - --
    command: ["pytest", "-q"]

volumes:
  product_reset_pip_cache:
