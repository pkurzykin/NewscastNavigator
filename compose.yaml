name: newscast_web_prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - web_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      APP_NAME: Newscast Navigator API
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SEED_DEMO_DATA: "false"
      SECRET_KEY: ${SECRET_KEY}
      STORAGE_PATH: ${STORAGE_PATH}
      EXPORT_PATH: ${EXPORT_PATH}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-512}
      ALLOWED_UPLOAD_EXTENSIONS: ${ALLOWED_UPLOAD_EXTENSIONS}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python scripts/bootstrap_runtime.py &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - web_storage:${STORAGE_PATH}
      - web_exports:${EXPORT_PATH}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${FRONTEND_VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/templates/newscast-web.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/logs/nginx:/var/log/nginx
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
    depends_on:
      nginx:
        condition: service_healthy
    ports:
      - "${NGINX_BIND_HOST:-127.0.0.1}:${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_BIND_HOST:-127.0.0.1}:${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/edge-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/templates/edge-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
      - "${SSL_CERT_PATH}:/etc/nginx/certs/fullchain.pem:ro"
      - "${SSL_KEY_PATH}:/etc/nginx/certs/privkey.pem:ro"
      - ./deploy/logs/nginx-edge:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

volumes:
  web_pg_data:
  web_storage:
  web_exports:
