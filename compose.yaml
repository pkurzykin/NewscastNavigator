name: newscast_product_reset_local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - local_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  backend:
    image: newscast-navigator-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: Newscast Navigator API
      ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ALLOW_NULL_CORS_ORIGIN: ${ALLOW_NULL_CORS_ORIGIN:-true}
      SEED_DEMO_DATA: "false"
      SECRET_KEY: ${SECRET_KEY}
      SESSION_COOKIE_SECURE: "false"
      CAPTIONPANELS_TOKEN_TTL_SECONDS: ${CAPTIONPANELS_TOKEN_TTL_SECONDS:-28800}
      SCENARIO_LEASE_TTL_SECONDS: ${SCENARIO_LEASE_TTL_SECONDS:-90}
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8100}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  frontend:
    image: newscast-navigator-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ""
      VITE_PROXY_TARGET: http://backend:8000
      VITE_DEV_HOST: 0.0.0.0
      VITE_DEV_PORT: 5173
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - local_frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  local_frontend_node_modules:
  local_pg_data:
